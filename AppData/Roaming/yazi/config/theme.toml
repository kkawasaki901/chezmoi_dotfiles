[flavor]
dark = "vscode-dark-modern"

[mgr]
cwd = { fg = "#89dceb" }

# 選択中/カーソルが乗っている行
hovered = { fg = "#1e1e2e", bg = "#89b4fa" }

# プレビュー側でカーソルが乗っている行
preview_hovered = { fg = "#1e1e2e", bg = "#a6e3a1" }

# コピー/カット時のマーカー
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#f9e2af", bg = "#f9e2af" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

[tabs]
active = { fg = "#11111b", bg = "#f9e2af" }
inactive = { fg = "#cdd6f4", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# 境界線
border_symbol = "│"
border_style = { fg = "#45475a" }

# 検索結果
find_keyword = { fg = "#11111b", bg = "#f9e2af" }
find_position = { fg = "#f5c2e7", bg = "reset" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa" }
normal_alt  = { fg = "#89b4fa", bg = "#313244" }

select_main = { fg = "#1e1e2e", bg = "#a6e3a1" }
select_alt  = { fg = "#a6e3a1", bg = "#313244" }

unset_main = { fg = "#1e1e2e", bg = "#f38ba8" }
unset_alt  = { fg = "#f38ba8", bg = "#313244" }

[filetype]

rules = [
  { mime = "image/*", fg = "#f5c2e7" },
  { mime = "video/*", fg = "#fab387" },
  { mime = "audio/*", fg = "#89b4fa" },
  { mime = "application/zip", fg = "#f9e2af" },
  { url = "*/", fg = "#89b4fa" },
  { url = "*", fg = "#cdd6f4" },
]

[git]
unknown_sign  = " "
modified_sign = "M"
deleted_sign  = "D"
clean_sign    = "✔"
