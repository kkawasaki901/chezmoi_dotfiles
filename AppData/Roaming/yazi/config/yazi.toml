[opener]

bat = [
    { run = 'bat --paging=always --pager="less -R" -- %s', block = true, desc = "View with bat", for = "windows" },
]

micro = [
    { run = '"C:\Users\kawasaki\AppData\Local\Microsoft\WinGet\Packages\zyedidia.micro_Microsoft.Winget.Source_8wekyb3d8bbwe\micro-2.0.15\micro.exe" %s', block = true, desc = "Edit with micro", for = "windows" },
]

explorer = [
    { run = 'explorer.exe %s1', orphan = true, desc = "Open in Explorer", for = "windows" },
]
nvim = [
    { run = 'nvim %s', block = true, desc = "edit with Neovim", for = "windows" },
]

obvim = [
    { run = '''pwsh -NoProfile -File "C:\Users\kawasaki\AppData/Roaming/yazi/config/scripts/obvim.ps1" %s''', block = true, desc = "edit with obvim", for = "windows" },
]


helix = [
    { run = 'hx %s', block = true, desc = "edit with helix", for = "windows" },
]


[open]

prepend_rules = [
    { url = "*.{md,markdown}", use = ["micro", "bat", "nvim", "obvim", "helix"] },
    { url = "*/", use = "explorer"},
    { url = "*.{yaml,toml,json}", use = ["micro", "nvim"] },
]

[plugin]

prepend_fetchers = [
    { url = "*",  run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
    { id = "simple-tag", url = "*", run = "simple-tag" , group = "simple-tag" },
    { id = "simple-tag", url = "*/", run = "simple-tag" , group = "simple-tag" },
]
prepend_previewers = [
    { url = "*.csv", run = "rich-preview"}, # for csv files
    { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
    { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
    { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
    { url = "*.json", run = "rich-preview"}, # for json (.json) files
#    { url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
]
