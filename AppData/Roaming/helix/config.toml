
"theme" = "ayu_dark"
[editor]
line-number = "relative"
scrolloff = 0
shell = ["pwsh", "-NoProfile", "-Command"]
# shell = ["nu", "--stdin", "-c"]

[editor.cursor-shape]
insert ="bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.insert.j]
j = "normal_mode"

[keys.normal]
C-s = ":w"

[keys.insert]
C-s = ":w"
