[theme]
name = "catppuccin-mocha"

[theme.colors]
primary = "#89b4fa"
foreground = "#cdd6f4"
background = "#1e1e2e"
secondary = "#f38ba8"

[keybindings.global]
help = "F1"
refresh = "F5"
quit = "q"

[keybindings.task_list]
done_task = "d"
delete_task = "Delete"
add_task = "a"
edit_task = "e"

[keybindings.task_detail]

[taskwarrior]
sync_enabled = false

[ui]
default_view = "task_list"
show_help_bar = true
task_list_columns = [
    "id",
    "project",
    "priority",
    "due",
    "description",
]
refresh_interval = 1000
